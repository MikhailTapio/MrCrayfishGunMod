plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = "${mod_version}+NeoForge+${minecraft_version}"
group = 'com.mrcrayfish.guns'
base { archivesName = archive_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// TODO: restore these optional integrations for NeoForge 1.21.1.
// Original source is retained; none of the core gameplay/rendering packages are excluded.
sourceSets.main.java {
    exclude 'com/mrcrayfish/guns/compat/SimplePlanesHelper.java'
    exclude 'com/mrcrayfish/guns/compat/CMDCamHelper.java'
    exclude 'com/mrcrayfish/guns/client/GunButtonBindings.java'
    exclude 'com/mrcrayfish/guns/client/GunConflictContext.java'
    exclude 'com/mrcrayfish/guns/client/handler/ControllerHandler.java'
    exclude 'com/mrcrayfish/guns/mixin/common/simpleplanes/ShooterUpgradeMixin.java'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        cgm { sourceSet sourceSets.main }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation "curse.maven:framework-549225:${framework_file_id}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    localRuntime "curse.maven:configured-457570:${configured_file_id}"
    compileOnly "maven.modrinth:curios:${curios_version_id}"
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version_id}"
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version_id}"
    compileOnly "maven.modrinth:travelersbackpack:${travelers_backpack_version_id}"
    compileOnly "maven.modrinth:l2backpack:${l2_backpack_version_id}"
    compileOnly "maven.modrinth:l2library:${l2_library_version_id}"
    compileOnly "curse.maven:backpacked-352835:${backpacked_file_id}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [mod_version: project.version, neo_version: neo_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '200'])
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.2.1'
    distributionType = Wrapper.DistributionType.BIN
}

jar {
    manifest.attributes('Specification-Title': 'Gun Mod',
            'Specification-Vendor': 'MrCrayfish',
            'Implementation-Title': 'CGM-Unofficial',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'MrCrayfish')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${mod_id}-${minecraft_version}"
            from components.java
        }
    }
}
